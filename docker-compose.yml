version: "3.9"

services:
  # ─── NestJS API (SQLite embarqué) ─────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: outage_backend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      JWT_SECRET: ${JWT_SECRET:-outage_jwt_secret_change_in_production}
    volumes:
      - db_data:/app/data
    networks:
      - outage_network
    ports:
      - "3000:3000"

  # ─── Angular 17 SPA (servi par Nginx) ─────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: outage_frontend
    restart: unless-stopped
    networks:
      - outage_network
    ports:
      - "80:80"

networks:
  outage_network:
    driver: bridge

volumes:
  db_data:
